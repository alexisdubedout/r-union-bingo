  .header-right { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
  .btn-regen { background: var(--accent); color: #0d0d10; border: none; border-radius: 10px; padding: 0.7rem 1.2rem; font-family: var(--font); font-weight: 700; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.05em; cursor: pointer; transition: transform 0.15s, background 0.15s; white-space: nowrap; }

  .btn-share { background: transparent; color: var(--accent); border: 1px solid rgba(200,240,96,0.4); border-radius: 10px; padding: 0.5rem 1rem; font-family: var(--mono); font-weight: 500; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.06em; cursor: pointer; transition: all 0.15s; white-space: nowrap; }

  .seed-badge { font-size: 0.65rem; font-family: var(--mono); color: var(--muted); text-align: right; }
  .seed-badge span { color: var(--text); }

  .stats { display: flex; gap: 0.75rem; margin-bottom: 1.5rem; }
  .stat { flex: 1; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 0.75rem 1rem; text-align: center; }
  .stat-val { font-size: 1.6rem; font-weight: 800; line-height: 1; letter-spacing: -0.02em; }
  .stat-val.accent { color: var(--accent); }
  .stat-val.orange { color: var(--accent2); }
  .stat-label { font-size: 0.65rem; color: var(--muted); margin-top: 4px; text-transform: uppercase; letter-spacing: 0.07em; font-family: var(--mono); }

  .grid { display: flex; flex-direction: column; gap: 6px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; display: flex; align-items: center; gap: 10px; transition: border-color 0.18s, background 0.18s; animation: fadeUp 0.3s both; }
  .card:nth-child(1){animation-delay:.03s}.card:nth-child(2){animation-delay:.06s}.card:nth-child(3){animation-delay:.09s}.card:nth-child(4){animation-delay:.12s}.card:nth-child(5){animation-delay:.15s}.card:nth-child(6){animation-delay:.18s}.card:nth-child(7){animation-delay:.21s}.card:nth-child(8){animation-delay:.24s}.card:nth-child(9){animation-delay:.27s}.card:nth-child(10){animation-delay:.30s}

  .word { font-size: 0.92rem; font-weight: 600; color: var(--text); flex: 1; min-width: 0; cursor: pointer; }
  .diff { font-size: 0.6rem; font-family: var(--mono); text-transform: uppercase; letter-spacing: 0.06em; padding: 2px 7px; border-radius: 5px; font-weight: 500; border: 1px solid; flex-shrink: 0; }

  .lb-empty { font-size: 0.8rem; color: var(--muted); font-family: var(--mono); padding: 1rem; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; text-align: center; }

async function sbFetch(path, opts = {}) {
  const res = await fetch(SB_URL + path, {
    ...opts,
    headers: {
      'apikey': SB_KEY,
      'Authorization': 'Bearer ' + SB_KEY,
      'Content-Type': 'application/json',
      'Prefer': 'return=minimal',
      ...(opts.headers || {})
    }
  });
  if (!res.ok) {
    const err = await res.text();
    throw new Error(err);
  }
  const text = await res.text();
  return text ? JSON.parse(text) : null;
}

async function insertScore(session_id, trigramme, mot, points) {
  return sbFetch('/rest/v1/scores', {
    method: 'POST',
    body: JSON.stringify({ session_id, trigramme, mot, points })
  });
}

async function deleteScore(session_id, trigramme, mot) {
  return sbFetch(`/rest/v1/scores?session_id=eq.${encodeURIComponent(session_id)}&trigramme=eq.${encodeURIComponent(trigramme)}&mot=eq.${encodeURIComponent(mot)}`, {
    method: 'DELETE'
  });
}

async function fetchSessionScores(session_id) {
  return sbFetch(`/rest/v1/scores?session_id=eq.${encodeURIComponent(session_id)}&select=trigramme,mot,points`, {
    headers: { 'Prefer': 'return=representation' }
  });
}

async function fetchGlobalScores() {
  return sbFetch('/rest/v1/scores?select=trigramme,points', {
    headers: { 'Prefer': 'return=representation' }

const diffLabel = ["","Facile","Moyen","Trash"];
const diffClass = ["","d1","d2","d3"];
const ptsClass  = p => p <= 1 ? "p1" : p <= 2 ? "p2" : "p3";
const medals    = ['🥇','🥈','🥉'];

let current = [], toastTimer, currentSeed = '';

// ── Seed ──────────────────────────────────────────────────────
function getSeedFromURL() { return new URLSearchParams(window.location.search).get('seed'); }
function setSeedInURL(seed) { const u = new URL(window.location.href); u.searchParams.set('seed', seed); window.history.replaceState({}, '', u); }
function randomSeed() { return Math.random().toString(36).slice(2, 8).toUpperCase(); }
function seededRandom(seed) {
  let h = 0;
  for (let i = 0; i < seed.length; i++) h = Math.imul(31, h) + seed.charCodeAt(i) | 0;
  return () => { h ^= h << 13; h ^= h >> 17; h ^= h << 5; return (h >>> 0) / 4294967296; };
}
function shuffleWithSeed(arr, rng) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}

function newSeed() { const s = randomSeed(); setSeedInURL(s); loadFromSeed(s); }

async function loadFromSeed(seed) {
  currentSeed = seed;
  document.getElementById('seed-display').textContent = seed;
  const rng  = seededRandom(seed);
  const easy = shuffleWithSeed(WORDS.filter(w => w.diff === 1), rng).slice(0, 3);
  const med  = shuffleWithSeed(WORDS.filter(w => w.diff === 2), rng).slice(0, 4);
  const hard = shuffleWithSeed(WORDS.filter(w => w.diff === 3), rng).slice(0, 3);
  current = shuffleWithSeed([...easy, ...med, ...hard], rng).map(w => ({ ...w, done: false, trig: '', dbId: null }));

  // Recharger les scores existants pour cette session depuis Supabase
  try {
    const rows = await fetchSessionScores(seed);
    if (rows && rows.length) {
      rows.forEach(row => {
        const idx = current.findIndex(w => w.word === row.mot);
        if (idx !== -1) { current[idx].done = true; current[idx].trig = row.trigramme; }
      });
    }
  } catch(e) { /* silencieux */ }

  renderAll();
  refreshLeaderboards();
}

// ── Partage ───────────────────────────────────────────────────
function copyLink() {
  navigator.clipboard.writeText(window.location.href).then(() => {
    const btn = document.getElementById('btn-share');
    btn.textContent = '✓ Lien copié !'; btn.classList.add('copied');
    setTimeout(() => { btn.textContent = '🔗 Copier le lien'; btn.classList.remove('copied'); }, 2000);
  });
}

// ── Tabs leaderboard ──────────────────────────────────────────
function switchTab(tab) {
  document.querySelectorAll('.lb-tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.lb-panel').forEach(p => p.classList.remove('active'));
  document.querySelector(`.lb-tab[onclick="switchTab('${tab}')"]`).classList.add('active');
  document.getElementById('lb-' + tab).classList.add('active');
}

// ── Leaderboards ──────────────────────────────────────────────
function renderLbHtml(entries, subFn) {
  if (!entries.length) return '<div class="lb-empty">Aucun score pour l\'instant</div>';
  return '<div class="lb-list">' + entries.map(([trig, data], idx) => `
    <div class="lb-row">
      <div class="lb-rank">${medals[idx] || (idx + 1)}</div>
      <div class="lb-trig">${trig}</div>
      <div class="lb-sub">${subFn(data)}</div>
      <div class="lb-score">${data.pts} pt${data.pts > 1 ? 's' : ''}</div>
    </div>`).join('') + '</div>';
}

async function refreshLeaderboards() {
  // Session
  try {
    const rows = await fetchSessionScores(currentSeed);
    const agg  = aggregateRows(rows || []);
    document.getElementById('lb-session').innerHTML =
      renderLbHtml(agg, d => `${d.words} mot${d.words > 1 ? 's' : ''} cette session`);
  } catch(e) {
    document.getElementById('lb-session').innerHTML = '<div class="lb-empty">Erreur de chargement</div>';
  }
  // Global
  try {
    const rows = await fetchGlobalScores();
    const agg  = aggregateRows(rows || []);
    document.getElementById('lb-global').innerHTML =
      renderLbHtml(agg, d => `${d.words} mot${d.words > 1 ? 's' : ''} au total`);
  } catch(e) {
    document.getElementById('lb-global').innerHTML = '<div class="lb-empty">Erreur de chargement</div>';
  }
}

function aggregateRows(rows) {
  const map = {};
  rows.forEach(r => {
    if (!map[r.trigramme]) map[r.trigramme] = { pts: 0, words: 0 };
    map[r.trigramme].pts   += r.points;
    map[r.trigramme].words += 1;
  });
  return Object.entries(map).sort((a, b) => b[1].pts - a[1].pts);
}

// ── Toggle ────────────────────────────────────────────────────
function setTrig(i, val) {
  current[i].trig = val.toUpperCase().replace(/[^A-Z]/g, '').slice(0, 3);
  updateStats();
}

async function toggle(i) {
  const w = current[i];
  if (!w.done && !w.trig) {
    document.getElementById('trig-' + i)?.focus();
    showToast('Entre un trigramme d\'abord !'); return;
  }

  const card = document.getElementById('card-' + i);
  const chk  = document.getElementById('chk-'  + i);

  if (!w.done) {
    // Cocher → insérer en DB
    card.classList.add('card-saving');
    try {
      await insertScore(currentSeed, w.trig, w.word, w.pts);
      w.done = true;
      card.classList.remove('card-saving');
      card.classList.add('done');
      chk.textContent = '✓';
      showToast("+" + w.pts + " pt" + (w.pts > 1 ? "s" : "") + " pour " + w.trig + " !");
      refreshLeaderboards();
    } catch(e) {
      card.classList.remove('card-saving');
      showToast('Erreur de sauvegarde 😬', true);
    }
  } else {
    // Décocher → supprimer en DB
    card.classList.add('card-saving');
    try {
      await deleteScore(currentSeed, w.trig, w.word);
      w.done = false;
      card.classList.remove('card-saving');
      card.classList.remove('done');
      chk.textContent = '';
      refreshLeaderboards();
    } catch(e) {
      card.classList.remove('card-saving');
      showToast('Erreur de suppression 😬', true);
    }
  }
  updateStats();
}

function updateStats() {
  let placed = 0, earned = 0, total = 0;
  current.forEach(w => { total += w.pts; if (w.done) { placed++; earned += w.pts; } });
  document.getElementById('s-placed').textContent = placed;
  document.getElementById('s-pts').textContent    = earned;
  document.getElementById('s-total').textContent  = total;
  document.getElementById('s-pct').textContent    = total > 0 ? Math.round((earned / total) * 100) + '%' : '0%';
}

function renderAll() {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  current.forEach((w, i) => {
    const card = document.createElement('div');
    card.className = 'card' + (w.done ? ' done' : '');
    card.id = 'card-' + i;
    const check = document.createElement('div');
    check.className = 'check'; check.id = 'chk-' + i;
    if (w.done) check.textContent = '✓';
    check.onclick = e => { e.stopPropagation(); toggle(i); };
    const word = document.createElement('div');
    word.className = 'word'; word.textContent = w.word; word.onclick = () => toggle(i);
    const diff = document.createElement('span');
    diff.className = 'diff ' + diffClass[w.diff]; diff.textContent = diffLabel[w.diff];
    const pts = document.createElement('span');
    pts.className = 'pts ' + ptsClass(w.pts);
    pts.textContent = w.pts + ' pt' + (w.pts > 1 ? 's' : '');
    const trigWrap = document.createElement('div');
    trigWrap.className = 'trig-wrap';
    const trigLabel = document.createElement('span');
    trigLabel.className = 'trig-label'; trigLabel.textContent = 'par';
    const inp = document.createElement('input');
    inp.className = 'trig-input'; inp.id = 'trig-' + i;
    inp.maxLength = 3; inp.placeholder = 'AAA'; inp.value = w.trig;
    inp.addEventListener('click', e => e.stopPropagation());
    inp.addEventListener('input', e => setTrig(i, e.target.value));
    trigWrap.append(trigLabel, inp);
    card.append(check, word, diff, pts, trigWrap);
    grid.appendChild(card);
  });
  updateStats();
}

function showToast(msg, isError = false) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast' + (isError ? ' error' : '');
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2500);
}

// ── Init ──────────────────────────────────────────────────────
const initSeed = getSeedFromURL() || randomSeed();
setSeedInURL(initSeed);
loadFromSeed(initSeed);
